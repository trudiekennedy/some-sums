{% extends "base.html" %}

{% block content %}
<div class="card">
  <h2>Let's do some sums!</h2>
  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}
  <form method="POST" action="{{ url_for('start') }}">
    <label for="name">What is your name?</label>
    <input type="text" id="name" name="name" maxlength="30" value="{{ name or '' }}" required>

    <label for="rounds">How many rounds do you want to play?</label>
    <input type="number" id="rounds" name="rounds" min="1" value="{{ rounds or 3 }}" required>

    <button type="submit">Let's go!</button>
  </form>
</div>
{% endblock %}
